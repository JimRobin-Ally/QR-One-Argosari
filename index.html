<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Portal Informasi Desa/Kelurahan</title>
  <meta name="description" content="Portal informasi UMKM, fasilitas umum, jalur evakuasi, dan kontak penting." />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="page-bg"></div>

  <main class="app-shell">
    <header class="hero">
      <p class="eyebrow">Portal Informasi Digital</p>
      <img src="assets/logo-placeholder.svg" alt="Logo" class="logo" />
      <h1 id="site-title">Desa/Kelurahan Anda</h1>
      <p id="site-subtitle" class="subtitle">Pilih informasi yang ingin kamu lihat.</p>
    </header>

    <section class="notice" id="notice-box" hidden></section>

    <section class="search-panel">
      <label for="search-input">Cari informasi</label>
      <input id="search-input" type="search" placeholder="Contoh: warung, puskesmas, evakuasi..." autocomplete="off" />
    </section>

    <nav id="category-grid" class="category-grid" aria-label="Daftar kategori"></nav>

    <section class="content-panel">
      <div class="section-heading">
        <div>
          <p class="eyebrow">Daftar informasi</p>
          <h2 id="active-category-title">Semua Informasi</h2>
        </div>
        <button id="show-all-button" class="ghost-button" type="button">Tampilkan semua</button>
      </div>
      <div id="items-list" class="items-list"></div>
      <p id="empty-state" class="empty-state" hidden>Tidak ada data yang cocok. Coba kata kunci lain.</p>
    </section>

    <footer class="footer">
      <p id="footer-text">Dikelola oleh Pemerintah Desa/Kelurahan. Terakhir diperbarui: -</p>
    </footer>
  </main>

  <script src="data.js"></script>
  <script src="script.js"></script>
</body>
</html>
